<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>CODE3 RP V3 LIVE</title><script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=0quUheVEl6jqx541GhCFpD2oHYGruuVv6uvc1r98ec5TLeuuHwVIwuizb30etSTZC535_XRiVSIG1wvTR50KwGtUPYOM4d-sW2Ll4sFn2hIJSoV3TIA9TMhswoJ9O_9mNz0PhZnOaeiW-4_8RzL7aSbwLQUn8RmO0sR6uim089MW6usCoF1xpFjBpL7TN8ag5Mb4vcqlxPbxpVt45MJqZgdjCXUTnBsJlwV8UVf8nzlTGEsON5WIJZpjh02yovyaPJxG8oIw_EbxRtCJ37QuSWvIZqoiRz82L6ujLnXvvJSveVPiyF-WQrdePowSOyLE" charset="UTF-8"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}body{min-height:100vh;color:#fff;background:radial-gradient(circle at 10% 10%,rgba(59,130,246,.35),transparent 30%),radial-gradient(circle at 90% 15%,rgba(139,92,246,.35),transparent 30%),radial-gradient(circle at 80% 80%,rgba(6,182,212,.25),transparent 25%),#070b14}.layout{display:grid;grid-template-columns:260px 1fr}.sidebar{padding:20px;background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,.08)}.logo{font-size:32px;font-weight:800}.sub{color:#9ca3af;margin-bottom:20px}.btn{width:100%;padding:14px;border:none;border-radius:14px;margin:6px 0;cursor:pointer;color:#fff;background:rgba(255,255,255,.08)}.main{padding:24px}.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:24px}.hero,.card{padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:15px 0}.big{font-size:34px;font-weight:800}.page{display:none}.active{display:block}input,select,textarea{width:100%;padding:12px;margin:6px 0;background:rgba(255,255,255,.08);border:none;border-radius:12px;color:#fff}textarea{min-height:90px}.primary{background:linear-gradient(135deg,#3b82f6,#8b5cf6)}.feedItem{padding:14px;margin:10px 0}.tag{display:inline-block;padding:4px 10px;border-radius:999px;background:#2563eb;margin-top:8px}</style></head><body><div class='layout'><div class='sidebar'><div class='logo'>🚨 CODE3 RP</div><div class='sub'>Live Staff Platform</div><button class='btn' onclick="showPage('dash')">Dashboard</button><button class='btn' onclick="showPage('report')">New Report</button><button class='btn' onclick="showPage('history')">History</button><button class='btn' onclick="showPage('offenders')">Offenders</button></div><div class='main'><div id='dash' class='page active'><div class='glass hero'><h1>🚨 CODE3 RP</h1><div>Staff Intelligence Center</div></div><div class='cards'><div class='glass card'>Reports<div id='r1' class='big'>0</div></div><div class='glass card'>100+ MPH<div id='r2' class='big'>0</div></div><div class='glass card'>Underaged<div id='r3' class='big'>0</div></div><div class='glass card'>Repeat<div id='r4' class='big'>0</div></div></div><div class='glass card'><h2>Recent Incidents</h2><div id='recent'></div></div></div><div id='report' class='page'><div class='glass card'><input id='moderator' list='mods' placeholder='Moderator'><datalist id='mods'></datalist><input id='player' list='players' placeholder='Player'><datalist id='players'></datalist><input id='vehicle' placeholder='Vehicle'><input id='speed' type='number' placeholder='Speed MPH'><select id='category'><option>Fail Roleplay (FRP)</option><option>Disrespecting Staff</option><option>Disrespecting Members</option><option>Underaged User (17+ Server)</option><option>Fail Driving RP</option><option>Trolling</option><option>Other</option></select><select id='severity'><option>Warning</option><option>Minor</option><option>Moderate</option><option>Severe</option><option>Ban Recommended</option></select><textarea id='notes' placeholder='Notes'></textarea><button class='btn primary' onclick='addReport()'>Submit</button></div></div><div id='history' class='page'><div class='glass card'><input id='search' placeholder='Search player...' oninput='renderHistory()'><div id='historyFeed'></div></div></div><div id='offenders' class='page'><div class='glass card'><div id='offendersFeed'></div></div></div></div></div><script type='module'>import{initializeApp}from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getDatabase,ref,push,onValue}from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';const firebaseConfig={apiKey:'AIzaSyCzvQXuU4BO5ntZ7B9zYfDA1fPdC0GnCgY',authDomain:'frp-log-system.firebaseapp.com',databaseURL:'https://frp-log-system-default-rtdb.firebaseio.com',projectId:'frp-log-system',storageBucket:'frp-log-system.firebasestorage.app',messagingSenderId:'261965861020',appId:'1:261965861020:web:e1866318ad5ded671a1d59'};const app=initializeApp(firebaseConfig);const db=getDatabase(app);const reportsRef=ref(db,'reports');let reports=[];window.showPage=id=>{document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')};window.addReport=()=>push(reportsRef,{player:player.value,moderator:moderator.value,vehicle:vehicle.value,speed:+speed.value||0,category:category.value,severity:severity.value,notes:notes.value,time:new Date().toLocaleString()});function refresh(){let c={};reports.forEach(x=>c[x.player]=(c[x.player]||0)+1);r1.textContent=reports.length;r2.textContent=reports.filter(x=>x.speed>100).length;r3.textContent=reports.filter(x=>String(x.category).includes('Underaged')).length;r4.textContent=Object.values(c).filter(v=>v>=2).length;players.innerHTML=[...new Set(reports.map(x=>x.player))].map(x=>`<option value="${x}">`).join('');mods.innerHTML=[...new Set(reports.map(x=>x.moderator))].map(x=>`<option value="${x}">`).join('');recent.innerHTML=reports.slice(0,5).map(r=>`<div class="glass feedItem"><b>${r.player}</b><br>${r.category}<br><span class="tag">${r.severity}</span></div>`).join('');renderHistory();offendersFeed.innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(o=>`<div class="glass feedItem"><b>${o[0]}</b><br>${o[1]} Reports</div>`).join('')}window.renderHistory=()=>{let q=(search?.value||'').toLowerCase();historyFeed.innerHTML=reports.filter(r=>r.player.toLowerCase().includes(q)).map(r=>`<div class="glass feedItem"><b>${r.player}</b><br>${r.category}<br>Moderator: ${r.moderator}<br>${r.time}</div>`).join('')};onValue(reportsRef,s=>{reports=[];const d=s.val();if(d)Object.values(d).forEach(v=>reports.push(v));refresh();});</script></body></html>
